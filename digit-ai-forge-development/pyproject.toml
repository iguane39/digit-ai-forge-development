[project]
name = "digit-ai-forge-development"
version = "0.0.0"
description = "Accélérateur SaaS Digit-AI — couche d'orchestration mince (conductor) de l'idée au SaaS de production."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
conductor = "conductor.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "mutmut>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conductor"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Dépendance tierce vendorisée au tag (BAD @v1.2.0) : épinglée, jamais modifiée → hors lint.
extend-exclude = ["vendor"]

[tool.ruff.lint]
# E/F (pyflakes+pycodestyle), I (isort), UP (pyupgrade), B (bugbear), SIM (simplify)
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["conductor", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mutmut]
# TF-0103.2 — mutmut ne tourne PAS nativement sous Windows (cf. conductor/gates/mutation_gate.py) :
# exécuter `uv run mutmut run` en CI (ubuntu-latest), dans .devcontainer/, ou sous WSL.
source_paths = ["conductor"]
# v0 : scope borné au code neuf de cette campagne (sandbox + gate anti-patterns) — mesure
# réelle documentée dans conductor/gates/mutation_gate.py. Étendre progressivement au reste
# de conductor/ (restes TF-0103.2) en retirant `only_mutate`.
only_mutate = ["conductor/sandbox.py", "conductor/gates/ai_antipatterns_gate.py"]
pytest_add_cli_args_test_selection = [
    "tests/test_sandbox.py",
    "tests/test_ai_antipatterns_gate.py",
    "tests/test_resolve_bad_runner.py",
    "tests/test_resolve_bmad_planner.py",
]
