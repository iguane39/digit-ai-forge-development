name: double-gate
# Definition of done (décision canonique 03) : aucun merge si le job code, design OU mutation
# échoue. Job `mutation` (TF-0103.2/TF-0120) : 3e métrique, BLOQUANTE depuis le 12/08/2026
# (score mesuré 94,25 % le 12/08/2026, 85,76 % le 02/11/2026, 97,09 % le 03/11/2026, seuil 75 % :
# cf. commentaire du job).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # --- Gate code (FR-G1) : harness du conductor lui-même (dogfooding) ---------
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
        working-directory: digit-ai-forge-development
      - name: Ruff (lint)
        run: uv run ruff check .
        working-directory: digit-ai-forge-development
      - name: Mypy (strict)
        run: uv run mypy
        working-directory: digit-ai-forge-development
      - name: Pytest
        run: uv run pytest
        working-directory: digit-ai-forge-development
      - name: Anti-patterns IA (imports fantômes, secrets, routes sans auth) — TF-0103.3
        run: uv run python -m conductor.gates.ai_antipatterns_gate conductor pyproject.toml
        working-directory: digit-ai-forge-development
      - name: Porte neutralisée (un contrôle qui ne peut plus dire non) — TF-1040
        run: uv run python -m conductor.gates.porte_neutralisee_gate ..
        working-directory: digit-ai-forge-development

  # --- Gate design (FR-G2/G3) : design.md lint + politique de sévérité forge ---
  # BLOQUANT depuis l'Epic 2 (story 2.1).
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
        working-directory: digit-ai-forge-development
      # ⚠ NE PAS se fier à l'exit code du linter (warnings → exit 0, cf. S-2.3).
      # On capture le JSON via l'alias de bin `designmd` (robuste cross-plateforme),
      # puis NOTRE politique décide du blocage.
      - name: design.md lint (JSON)
        run: >-
          npx --yes -p @google/design.md@0.3.0 designmd lint
          --format json design/DESIGN.md > findings.json
        working-directory: digit-ai-forge-development
      - name: Politique de sévérité (gate bloquant)
        run: uv run python -m conductor.gates.design_gate findings.json
        working-directory: digit-ai-forge-development

  # --- Gate mutation (TF-0103.2/TF-0120) : 3e métrique du double gate, mutmut ---------
  # BLOQUANT depuis le 12/08/2026 (TF-0120) : après renforcement des tests sur le scope
  # `only_mutate` (pyproject.toml [tool.mutmut]), score mesuré le 12/08/2026 à 94,25 % (344
  # killed / 21 survived / 365 total), seuil 75 % (conductor/gates/mutation_gate.py) dépassé — y
  # compris sans retirer du dénominateur les 21 mutants équivalents documentés
  # (docs/mutation-equivalents.md). Mesure du 02/11/2026 (TF-2059) : 85,76 % (560 killed / 93
  # survived / 653 total), obtenue en rejouant ce job sous Docker python:3.11-slim (mutmut 3.7.0,
  # mêmes commandes que ci-dessous) sur le main courant : le scope compte 288 mutants de plus que
  # le 12/08, issus des contrôles ajoutés à ai_antipatterns_gate.py les 14 et 15/09/2026.
  # Mesure du 03/11/2026 (TF-2068), mêmes commandes, après les tests qui tuent 74 de ces 93
  # survivants : 97,09 % (634 killed / 19 survived / 653 total), les 19 survivants étant les
  # mutants équivalents du registre. Seuil 75 % dépassé ; ces citations ne valent qu'à leur
  # date, la valeur qui compte est celle que le job calcule à chaque run.
  # Restes : étendre `only_mutate` au reste de `conductor/`.
  # mutmut ne tourne PAS nativement sous Windows : ce job (ubuntu-latest) est aujourd'hui le
  # seul point d'exécution réel hors devcontainer/WSL (TF-0103.1).
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
        working-directory: digit-ai-forge-development
      - name: mutmut run (scope v0 — cf. [tool.mutmut] only_mutate)
        run: uv run mutmut run
        working-directory: digit-ai-forge-development
      - name: Export des stats CI/CD mutmut
        run: uv run mutmut export-cicd-stats
        working-directory: digit-ai-forge-development
      - name: Politique de seuil (score de mutation)
        run: uv run python -m conductor.gates.mutation_gate mutants/mutmut-cicd-stats.json
        working-directory: digit-ai-forge-development
